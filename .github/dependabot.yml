version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    groups:
      # init and analyze must run the same version, or CodeQL refuses to run
      codeql-action:
        patterns:
          - "github/codeql-action*"
